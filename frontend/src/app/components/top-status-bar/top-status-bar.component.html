<header class="gcs-header">
  <div class="header-left">
    <div class="brand-titles">
      <h1 class="app-title">AeroTwin GCS</h1>
      <span class="app-subtitle">MALE UAV · PROPULSION DIGITAL TWIN · PS 26054</span>
    </div>
  </div>

  <div class="header-right">
    <div class="header-context">
      <span class="metric-caption">ENGINE</span>
      <strong class="metric-val mono">{{ engineId() }}</strong>
    </div>
    <div class="header-context">
      <span class="metric-caption">MISSION</span>
      <strong class="metric-val mono">{{ missionId() }}</strong>
    </div>
    <div class="header-vdiv"></div>
    <div class="status-metric">
      <span class="metric-caption">HEALTH</span>
      <strong class="metric-val" [class.metric-caution]="health().overall_score < 80" [class.metric-critical]="health().overall_score < 55">{{ healthLabel() }}</strong>
    </div>
    <div class="status-metric">
      <span class="metric-caption">FAULTS</span>
      <strong class="metric-val" [class.metric-critical]="activeAlertCount() > 0">{{ activeAlertCount() }}</strong>
    </div>
    <div class="status-metric">
      <span class="metric-caption">TELEMETRY</span>
      <strong class="metric-val mono">{{ telemetryRate().toFixed(1) }} Hz</strong>
    </div>
    <div class="conn-indicator" [ngClass]="'conn-' + connectionState().toLowerCase()">
      <span class="conn-dot"></span>
      <span>{{ connectionLabel() }}</span>
    </div>
  </div>
</header>
