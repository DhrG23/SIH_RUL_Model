<div class="gcs-shell">
  <button class="mobile-nav-backdrop" [class.visible]="mobileNavOpen()" aria-label="Close navigation" (click)="closeMobileNav()"></button>
    <aside class="sidebar"
      [attr.aria-label]="'Primary navigation'"
         [class.sidebar-mobile-open]="mobileNavOpen()">

    <!-- Brand Mark -->
    <div class="sidebar-brand">
      <span class="sidebar-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" role="presentation">
          <circle cx="16" cy="16" r="3.2" class="brand-core" />
          <path d="M16 5.2c2.8 4.1 2.8 7.4 0 9.6-2.8-2.2-2.8-5.5 0-9.6Z" class="brand-blade" />
          <path d="M26.8 21c-4.8.9-7.9-.2-9.2-3.6 3.4-1.3 6.5-.1 9.2 3.6Z" class="brand-blade" />
          <path d="M9.2 21c4.8-.9 7.9.2 9.2 3.6-3.4 1.3-6.5.1-9.2-3.6Z" class="brand-blade" />
        </svg>
      </span>
      <span class="sidebar-title">AEROTWIN <em>PROPULSION GCS</em></span>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      @for (view of views; track view.id) {
        <a class="nav-item"
          [routerLink]="view.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          [attr.aria-current]="null"
          [title]="view.label"
          (click)="closeMobileNav()">
          <span class="nav-icon">{{ view.icon }}</span>
          <span class="nav-label">{{ view.label }}</span>
        </a>
      }
    </nav>

    <!-- Footer: Theme Toggle + Connection -->
    <div class="sidebar-footer">
      <button class="nav-item" type="button" (click)="themeService.toggleTheme()" [title]="themeService.theme() === 'dark' ? 'Use light theme' : 'Use dark theme'">
        <span class="nav-icon">{{ themeService.theme() === 'dark' ? 'LT' : 'DK' }}</span>
        <span class="nav-label">{{ themeService.theme() === 'dark' ? 'Light theme' : 'Dark theme' }}</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="main-area">
    <app-top-status-bar />
    <button class="mobile-menu-button" type="button" aria-label="Open navigation" (click)="toggleMobileNav()"><span aria-hidden="true">☰</span><span>Menu</span></button>
    <main class="gcs-workspace">
      <router-outlet />
    </main>
  </div>
</div>
